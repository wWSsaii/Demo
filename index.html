<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>王思羽 · 个人产品展示</title>
  <meta name="description" content="王思羽 · AI 产品运营 / AI 产品助理 个人产品展示 —— AI 工作流落地、产品 0→1 搭建、数据驱动运营。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   王思羽 · 个人产品展示  —  科技绿主题（内联单文件版）
   ============================================================ */

:root {
  --green-50: #ecfdf5;
  --green-100: #d1fae5;
  --green-200: #a7f3d0;
  --green-300: #6ee7b7;
  --green-400: #34d399;
  --green-500: #10b981;
  --green-600: #059669;
  --green-700: #047857;

  --accent: #34d399;
  --ink: #0f172a;
  --muted: #475569;
  --faint: #94a3b8;
  --bg: #ffffff;
  --bg-alt: #f0fdf9;
  --card: #ffffff;
  --border: #e2e8f0;
  --shadow-sm: 0 1px 3px rgba(15, 23, 42, .08);
  --shadow-md: 0 8px 24px rgba(5, 150, 105, .10);
  --shadow-lg: 0 18px 48px rgba(5, 150, 105, .18);

  --radius: 16px;
  --radius-sm: 10px;
  --maxw: 1120px;
  --nav-h: 64px;

  --ease: cubic-bezier(.2, .7, .2, 1);
  --font: "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI",
          "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  font-family: var(--font);
  color: var(--ink);
  background: var(--bg);
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

img, video { max-width: 100%; display: block; }

a { color: inherit; text-decoration: none; }

.container {
  width: 100%;
  max-width: var(--maxw);
  margin-inline: auto;
  padding-inline: clamp(18px, 5vw, 40px);
}

/* ====== 导航 ====== */
.nav {
  position: sticky;
  top: 0;
  z-index: 50;
  height: var(--nav-h);
  background: rgba(255, 255, 255, .82);
  backdrop-filter: saturate(160%) blur(12px);
  border-bottom: 1px solid var(--border);
  transition: box-shadow .3s var(--ease);
}
.nav.is-scrolled { box-shadow: var(--shadow-sm); }

.nav__inner {
  height: 100%;
  max-width: var(--maxw);
  margin-inline: auto;
  padding-inline: clamp(18px, 5vw, 40px);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.nav__brand {
  font-weight: 900;
  font-size: 1.15rem;
  letter-spacing: .5px;
  color: var(--green-700);
}
.nav__brand-dot { color: var(--green-400); }

.nav__links { display: flex; gap: clamp(14px, 3vw, 34px); }
.nav__links a {
  position: relative;
  font-weight: 500;
  font-size: .98rem;
  color: var(--muted);
  padding: 6px 2px;
  transition: color .25s var(--ease);
}
.nav__links a::after {
  content: "";
  position: absolute;
  left: 0; right: 100%;
  bottom: -2px;
  height: 2px;
  background: var(--green-500);
  border-radius: 2px;
  transition: right .3s var(--ease);
}
.nav__links a:hover,
.nav__links a.is-active { color: var(--green-700); }
.nav__links a:hover::after,
.nav__links a.is-active::after { right: 0; }

.nav__toggle {
  display: none;
  flex-direction: column;
  justify-content: center;
  gap: 5px;
  width: 42px; height: 42px;
  border: none;
  background: transparent;
  cursor: pointer;
}
.nav__toggle span {
  display: block;
  height: 2px;
  width: 22px;
  background: var(--ink);
  border-radius: 2px;
  transition: transform .3s var(--ease), opacity .3s var(--ease);
}
.nav.is-open .nav__toggle span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.nav.is-open .nav__toggle span:nth-child(2) { opacity: 0; }
.nav.is-open .nav__toggle span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

/* ====== Hero / 简介 ====== */
.hero {
  position: relative;
  overflow: hidden;
  padding-top: clamp(48px, 9vw, 96px);
  padding-bottom: clamp(64px, 11vw, 130px);
  background: linear-gradient(160deg, var(--green-700), var(--green-500) 55%, var(--green-400));
  color: #fff;
}
.hero__bg {
  position: absolute;
  inset: -30% -10% auto -10%;
  height: 160%;
  background:
    radial-gradient(40% 55% at 18% 22%, rgba(255,255,255,.22), transparent 60%),
    radial-gradient(45% 50% at 82% 30%, rgba(255,255,255,.16), transparent 60%),
    radial-gradient(35% 45% at 60% 85%, rgba(255,255,255,.14), transparent 60%);
  background-size: 200% 200%;
  animation: bgFloat 16s var(--ease) infinite alternate;
  pointer-events: none;
}
@keyframes bgFloat {
  0%   { background-position: 0% 0%, 100% 0%, 50% 100%; }
  100% { background-position: 30% 40%, 70% 30%, 40% 60%; }
}

.hero__inner {
  position: relative;
  display: grid;
  grid-template-columns: auto 1fr;
  gap: clamp(22px, 4vw, 48px);
  align-items: center;
}
.avatar {
  width: clamp(96px, 16vw, 148px);
  height: clamp(96px, 16vw, 148px);
  border-radius: 28px;
  display: grid;
  place-items: center;
  font-size: clamp(2.6rem, 7vw, 4rem);
  font-weight: 900;
  color: var(--green-700);
  background: rgba(255, 255, 255, .92);
  box-shadow: 0 12px 30px rgba(2, 44, 34, .35);
  border: 3px solid rgba(255, 255, 255, .6);
}
.avatar--img { object-fit: cover; padding: 0; line-height: 0; }
.hero__name {
  margin: 0;
  font-size: clamp(1.9rem, 5vw, 3rem);
  font-weight: 900;
  letter-spacing: .5px;
}
.hero__title {
  margin: 6px 0 14px;
  font-size: clamp(1rem, 2.4vw, 1.25rem);
  font-weight: 500;
  color: rgba(255, 255, 255, .92);
}
.badge {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 5px 13px;
  border-radius: 999px;
  font-size: .85rem;
  font-weight: 600;
  background: rgba(255, 255, 255, .18);
  border: 1px solid rgba(255, 255, 255, .35);
  backdrop-filter: blur(4px);
}
.badge::before {
  content: "";
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #bbf7d0;
  box-shadow: 0 0 0 0 rgba(187, 247, 208, .8);
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%   { box-shadow: 0 0 0 0 rgba(187, 247, 208, .7); }
  70% { box-shadow: 0 0 0 9px rgba(187, 247, 208, 0); }
  100% { box-shadow: 0 0 0 0 rgba(187, 247, 208, 0); }
}

.hero__summary {
  grid-column: 1 / -1;
  margin: 6px 0 0;
  max-width: 760px;
  color: rgba(255, 255, 255, .94);
  font-size: clamp(.95rem, 2vw, 1.05rem);
}

.hero__stats {
  grid-column: 1 / -1;
  margin-top: clamp(20px, 4vw, 34px);
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
}
.stat {
  background: rgba(255, 255, 255, .14);
  border: 1px solid rgba(255, 255, 255, .28);
  border-radius: var(--radius-sm);
  padding: 16px 14px;
  text-align: center;
  transition: transform .3s var(--ease), background .3s var(--ease);
}
.stat:hover { transform: translateY(-4px); background: rgba(255, 255, 255, .22); }
.stat__value {
  font-size: clamp(1.3rem, 3.4vw, 1.85rem);
  font-weight: 900;
  line-height: 1.1;
}
.stat__label { font-size: .82rem; color: rgba(255, 255, 255, .85); margin-top: 4px; }

.hero__scroll {
  position: absolute;
  left: 50%;
  bottom: 18px;
  transform: translateX(-50%);
  width: 26px; height: 42px;
  border: 2px solid rgba(255, 255, 255, .6);
  border-radius: 16px;
  display: grid;
  place-items: start center;
  padding-top: 7px;
}
.hero__scroll-dot {
  width: 4px; height: 9px;
  border-radius: 4px;
  background: #fff;
  animation: scrollDot 1.8s var(--ease) infinite;
}
@keyframes scrollDot {
  0% { transform: translateY(0); opacity: 1; }
  70% { transform: translateY(14px); opacity: .2; }
  100% { transform: translateY(0); opacity: 1; }
}

/* ====== 通用 Section ====== */
.section { padding: clamp(56px, 9vw, 104px) 0; }
.section--alt { background: var(--bg-alt); }
.section__head { max-width: 720px; margin-bottom: clamp(28px, 5vw, 48px); }
.section__kicker {
  display: inline-block;
  font-size: .8rem;
  font-weight: 700;
  letter-spacing: 3px;
  color: var(--green-600);
  margin-bottom: 8px;
}
.section__title {
  margin: 0;
  font-size: clamp(1.6rem, 4vw, 2.3rem);
  font-weight: 900;
  letter-spacing: .5px;
}
.section__sub { margin: 10px 0 0; color: var(--muted); font-size: 1rem; }

/* ====== 项目卡片 ====== */
.projects__grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
  gap: clamp(18px, 3vw, 28px);
}
.card {
  display: flex;
  flex-direction: column;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: transform .35s var(--ease), box-shadow .35s var(--ease), border-color .35s var(--ease);
}
.card:hover {
  transform: translateY(-8px);
  box-shadow: var(--shadow-lg);
  border-color: var(--green-200);
}
.card__media {
  position: relative;
  aspect-ratio: 16 / 10;
  background: var(--green-50);
  overflow: hidden;
}
.card__media img,
.card__media video {
  width: 100%; height: 100%;
  object-fit: cover;
  transition: transform .5s var(--ease);
}
.card:hover .card__media img,
.card:hover .card__media video { transform: scale(1.06); }
.card__media-placeholder {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  color: var(--green-600);
  font-weight: 700;
  background: linear-gradient(135deg, var(--green-50), var(--green-100));
}
.card__period {
  position: absolute;
  top: 12px; left: 12px;
  padding: 4px 10px;
  font-size: .76rem;
  font-weight: 600;
  color: #fff;
  background: rgba(5, 150, 105, .9);
  border-radius: 999px;
  backdrop-filter: blur(2px);
}
.card__more {
  position: absolute;
  bottom: 12px; right: 12px;
  padding: 5px 11px;
  font-size: .78rem;
  font-weight: 600;
  color: var(--green-700);
  background: rgba(255, 255, 255, .92);
  border-radius: 999px;
  opacity: 0;
  transform: translateY(6px);
  transition: opacity .3s var(--ease), transform .3s var(--ease);
}
.card:hover .card__more { opacity: 1; transform: translateY(0); }

.card__body { padding: 18px 20px 22px; display: flex; flex-direction: column; gap: 12px; flex: 1; }
.card__name { margin: 0; font-size: 1.12rem; font-weight: 700; line-height: 1.4; }
.card__role { margin: 0; font-size: .85rem; color: var(--green-600); font-weight: 600; }
.card__desc { margin: 0; color: var(--muted); font-size: .92rem; }
.card__tags { display: flex; flex-wrap: wrap; gap: 7px; }
.tag {
  font-size: .76rem;
  padding: 4px 10px;
  border-radius: 999px;
  color: var(--green-700);
  background: var(--green-50);
  border: 1px solid var(--green-100);
  transition: background .25s var(--ease), color .25s var(--ease);
}
.card:hover .tag { background: var(--green-100); }
.card__metrics {
  margin-top: auto;
  display: flex;
  gap: 10px;
  padding-top: 12px;
  border-top: 1px dashed var(--border);
}
.metric { flex: 1; text-align: center; }
.metric__value { font-size: 1.05rem; font-weight: 900; color: var(--green-700); }
.metric__label { font-size: .74rem; color: var(--faint); }

/* ====== 技能 ====== */
.skills__grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: clamp(16px, 3vw, 24px);
}
.skill-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px 22px;
  box-shadow: var(--shadow-sm);
  transition: transform .35s var(--ease), box-shadow .35s var(--ease);
}
.skill-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-md); }
.skill-card__head {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 16px;
}
.skill-card__icon {
  width: 38px; height: 38px;
  border-radius: 11px;
  display: grid; place-items: center;
  background: var(--green-100);
  color: var(--green-700);
  font-weight: 900;
  font-size: 1.1rem;
}
.skill-card__cat { margin: 0; font-size: 1.05rem; font-weight: 700; }
.skill-card__items { display: flex; flex-wrap: wrap; gap: 9px; }
.skill-card__items .tag {
  cursor: default;
  font-size: .82rem;
  padding: 6px 12px;
  transition: transform .25s var(--ease), background .25s var(--ease);
}
.skill-card__items .tag:hover { transform: translateY(-3px); background: var(--green-500); color: #fff; border-color: var(--green-500); }

/* ====== 联系方式（隐私脱敏：联系方式运行时解码） ====== */
.contact__grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 18px;
}
.contact-card {
  display: flex;
  align-items: center;
  gap: 16px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px 22px;
  box-shadow: var(--shadow-sm);
  transition: transform .3s var(--ease), box-shadow .3s var(--ease);
}
.contact-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-md); border-color: var(--green-200); }
.contact-card__icon {
  flex: none;
  width: 46px; height: 46px;
  border-radius: 12px;
  display: grid; place-items: center;
  background: var(--green-100);
  color: var(--green-700);
  font-size: 1.3rem;
}
.contact-card__meta { min-width: 0; }
.contact-card__label { font-size: .8rem; color: var(--faint); }
.contact-card__value {
  font-weight: 700;
  font-size: 1.02rem;
  color: var(--ink);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.contact-card__copy {
  margin-left: auto;
  flex: none;
  border: 1px solid var(--green-200);
  background: var(--green-50);
  color: var(--green-700);
  font-size: .78rem;
  font-weight: 600;
  padding: 6px 12px;
  border-radius: 999px;
  cursor: pointer;
  transition: background .25s var(--ease), color .25s var(--ease);
}
.contact-card__copy:hover { background: var(--green-500); color: #fff; border-color: var(--green-500); }
.contact-card__copy.is-done { background: var(--green-600); color: #fff; border-color: var(--green-600); }
.contact__avail {
  margin-top: 22px;
  display: flex; align-items: center; gap: 12px;
  flex-wrap: wrap;
}

/* ====== 页脚 ====== */
.footer {
  background: var(--green-700);
  color: rgba(255, 255, 255, .9);
  text-align: center;
  padding: 26px 18px;
  font-size: .9rem;
}

/* ====== 灯箱 ====== */
.lightbox {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: grid;
  place-items: center;
  padding: clamp(14px, 4vw, 40px);
}
.lightbox[hidden] { display: none; }
.lightbox__backdrop {
  position: absolute; inset: 0;
  background: rgba(8, 28, 22, .82);
  backdrop-filter: blur(4px);
  animation: fadeIn .3s var(--ease);
}
.lightbox__panel {
  position: relative;
  width: min(960px, 100%);
  max-height: 90vh;
  overflow: auto;
  background: var(--bg);
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  animation: popIn .35s var(--ease);
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes popIn { from { opacity: 0; transform: translateY(16px) scale(.98); } to { opacity: 1; transform: none; } }
.lightbox__close {
  position: absolute; top: 12px; right: 12px;
  z-index: 2;
  width: 38px; height: 38px;
  border: none; border-radius: 50%;
  background: rgba(255, 255, 255, .9);
  color: var(--ink);
  font-size: 1.5rem; line-height: 1;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
}
.lightbox__stage { background: var(--green-50); }
.lightbox__stage img,
.lightbox__stage video { width: 100%; max-height: 62vh; object-fit: contain; background: #06231a; }
.lightbox__bar { padding: 20px 24px 26px; }
.lightbox__bar h3 { margin: 0 0 4px; font-size: 1.2rem; }
.lightbox__bar .role { margin: 0 0 12px; color: var(--green-600); font-weight: 600; font-size: .9rem; }
.lightbox__bar p { margin: 0 0 12px; color: var(--muted); }
.lightbox__bar ul { margin: 0; padding-left: 18px; color: var(--muted); }
.lightbox__bar li { margin: 6px 0; }
.lightbox__thumbs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.lightbox__thumbs button {
  width: 64px; height: 44px;
  border: 2px solid transparent;
  border-radius: 8px;
  overflow: hidden;
  padding: 0; cursor: pointer;
  background: var(--green-100);
}
.lightbox__thumbs button.is-active { border-color: var(--green-600); }
.lightbox__thumbs img { width: 100%; height: 100%; object-fit: cover; }

/* ====== 滚动渐显 ====== */
.reveal {
  opacity: 0;
  transform: translateY(28px);
  transition: opacity .7s var(--ease), transform .7s var(--ease);
  will-change: opacity, transform;
}
.reveal.is-visible { opacity: 1; transform: none; }
.reveal[data-delay="1"] { transition-delay: .08s; }
.reveal[data-delay="2"] { transition-delay: .16s; }
.reveal[data-delay="3"] { transition-delay: .24s; }
.reveal[data-delay="4"] { transition-delay: .32s; }

/* ====== 响应式 ====== */
@media (max-width: 860px) {
  .nav__toggle { display: flex; }
  .nav__links {
    position: absolute;
    top: var(--nav-h); left: 0; right: 0;
    flex-direction: column;
    gap: 0;
    background: #fff;
    border-bottom: 1px solid var(--border);
    box-shadow: var(--shadow-md);
    max-height: 0;
    overflow: hidden;
    transition: max-height .35s var(--ease);
  }
  .nav.is-open .nav__links { max-height: 280px; }
  .nav__links a { padding: 15px clamp(18px, 5vw, 40px); border-top: 1px solid var(--border); }
  .nav__links a::after { display: none; }
}

@media (max-width: 720px) {
  .hero__inner { grid-template-columns: 1fr; text-align: left; }
  .hero__stats { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 460px) {
  .projects__grid { grid-template-columns: 1fr; }
  .hero__stats { grid-template-columns: repeat(2, 1fr); }
}

/* ====== 降低动效偏好 ====== */
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; scroll-behavior: auto !important; }
  .reveal { opacity: 1; transform: none; transition: none; }
  .card:hover, .skill-card:hover, .contact-card:hover, .stat:hover { transform: none; }
}
</style>
</head>
<body>

  <!-- 顶部导航 -->
  <header class="nav" id="nav">
    <div class="nav__inner">
      <a class="nav__brand" href="#hero" data-scroll>王思羽<span class="nav__brand-dot">.</span></a>
      <button class="nav__toggle" id="navToggle" aria-label="打开菜单" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <nav class="nav__links" id="navLinks">
        <a href="#hero" data-scroll>简介</a>
        <a href="#projects" data-scroll>项目</a>
        <a href="#skills" data-scroll>技能</a>
        <a href="#contact" data-scroll>联系</a>
      </nav>
    </div>
  </header>

  <main>
    <!-- 个人简介 / Hero -->
    <section id="hero" class="hero">
      <div class="hero__bg" aria-hidden="true"></div>
      <div class="container hero__inner" id="heroContent"></div>
      <a class="hero__scroll" href="#projects" data-scroll aria-label="向下滚动">
        <span class="hero__scroll-dot"></span>
      </a>
    </section>

    <!-- 项目展示 -->
    <section id="projects" class="section">
      <div class="container">
        <header class="section__head reveal">
          <span class="section__kicker">PROJECTS</span>
          <h2 class="section__title">项目展示</h2>
          <p class="section__sub">从 AI 智能体到 0→1 校园产品，覆盖工作流落地与增长运营。</p>
        </header>
        <div class="projects__grid" id="projectsGrid"></div>
      </div>
    </section>

    <!-- 技能亮点 -->
    <section id="skills" class="section section--alt">
      <div class="container">

  function setupLightbox() {
    var box = $("#lightbox");

      if (box.hidden) return;
      if (e.key === "Escape") closeLightbox();
      if (e.key === "ArrowRight" && lbState.list.length > 1) { lbState.index = (lbState.index + 1) % lbState.list.length; renderStage(); }
      if (e.key === "ArrowLeft" && lbState.list.length > 1) { lbState.index = (lbState.index - 1 + lbState.list.length) % lbState.list.length; renderStage(); }
    });
  }

  /* ---------------- 滚动渐显 ---------------- */
  function setupReveal() {
    var items = $$(".reveal");
    if (!("IntersectionObserver" in window)) { items.forEach(function (el) { el.classList.add("is-visible"); }); return; }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) { en.target.classList.add("is-visible"); io.unobserve(en.target); }
      });
    }, { threshold: 0.12, rootMargin: "0px 0px -8% 0px" });
    items.forEach(function (el) { io.observe(el); });
  }

  /* ---------------- 导航：滚动监听 / 汉堡 / 平滑滚动 ---------------- */
  function setupNav() {
    var nav = $("#nav");
    var toggle = $("#navToggle");
    var links = $("#navLinks");
    var navH = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--nav-h")) || 64;

    var sections = ["hero", "projects", "skills", "contact"]
      .map(function (id) { return document.getElementById(id); })
      .filter(Boolean);
    var linkMap = {};
    $$("a", links).forEach(function (a) {
      var id = a.getAttribute("href").slice(1);
      linkMap[id] = a;
    });

    var onScroll = function () {
      nav.classList.toggle("is-scrolled", window.scrollY > 10);
      var current = "";
      sections.forEach(function (sec) {
        if (window.scrollY >= sec.offsetTop - navH - 20) current = sec.id;
      });
      Object.values(linkMap).forEach(function (a) { a.classList.remove("is-active"); });
      if (linkMap[current]) linkMap[current].classList.add("is-active");
    };
    window.addEventListener("scroll", onScroll, { passive: true });
    onScroll();

    toggle.addEventListener("click", function () {
      var open = nav.classList.toggle("is-open");
      toggle.setAttribute("aria-expanded", String(open));
    });

    $$("a[data-scroll]").forEach(function (a) {
      a.addEventListener("click", function (e) {
        var id = a.getAttribute("href").slice(1);
        var target = document.getElementById(id);
        if (!target) return;
        e.preventDefault();
        var y = target.getBoundingClientRect().top + window.scrollY - navH + 1;
        window.scrollTo({ top: y, behavior: "smooth" });
        nav.classList.remove("is-open");
        toggle.setAttribute("aria-expanded", "false");
      });
    });
  }

    setupLightbox();
    setupNav();
    setupReveal();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
